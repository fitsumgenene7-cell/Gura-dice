<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="diceBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="50%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>
    <linearGradient id="goldPip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7CC" />
      <stop offset="35%" stop-color="#FACC15" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#EAB308" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Die Body -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#diceBg)" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1.5" />
  <!-- Corner inlays -->
  <path d="M 10 16 L 10 10 L 16 10" stroke="#EAB308" stroke-opacity="0.5" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M 54 16 L 54 10 L 48 10" stroke="#EAB308" stroke-opacity="0.5" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M 10 48 L 10 54 L 16 54" stroke="#EAB308" stroke-opacity="0.5" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M 54 48 L 54 54 L 48 54" stroke="#EAB308" stroke-opacity="0.5" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Gold Pips (Face 5 style) -->
  <circle cx="20" cy="20" r="4.5" fill="url(#goldPip)" filter="url(#goldGlow)" />
  <circle cx="44" cy="20" r="4.5" fill="url(#goldPip)" filter="url(#goldGlow)" />
  <circle cx="32" cy="32" r="5.5" fill="url(#goldPip)" filter="url(#goldGlow)" />
  <circle cx="20" cy="44" r="4.5" fill="url(#goldPip)" filter="url(#goldGlow)" />
  <circle cx="44" cy="44" r="4.5" fill="url(#goldPip)" filter="url(#goldGlow)" />
</svg>